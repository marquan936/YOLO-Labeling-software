<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Annotator — YOLO 自动标注工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Loading overlay -->
    <div id="app-loading" style="display:flex;position:fixed;inset:0;background:var(--bg-primary);z-index:99999;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
        <div class="loading-spinner" style="width:40px;height:40px;border-width:4px;"></div>
        <span style="color:var(--text-secondary);">Auto-Annotator 加载中...</span>
    </div>

    <!-- Header -->
    <header id="app-header">
        <div class="header-left">
            <h1>🏷️ Auto-Annotator</h1>
        </div>
        <div class="header-center" id="header-stats">
            <span class="stat-item">📁 <strong id="stat-total">0</strong></span>
            <span class="stat-item">✋ <strong id="stat-annotated">0</strong></span>
            <span class="stat-item">🤖 <strong id="stat-predicted">0</strong></span>
            <span class="stat-item">✅ <strong id="stat-reviewed">0</strong></span>
        </div>
        <div id="batch-progress-global" class="batch-progress-global" style="display:none;">
            <span id="batch-progress-label" class="batch-progress-label">批量预测中...</span>
            <div class="progress-bar batch-progress-track">
                <div id="batch-progress-fill" class="progress-fill" style="width:0%"></div>
            </div>
            <span id="batch-progress-count" class="batch-progress-count">0 / 0</span>
        </div>
        <div class="header-right">
            <button class="btn btn-sm" onclick="App.showShortcutsModal()" title="快捷键参考 ⌨">⌨️ 快捷键</button>
            <button class="btn btn-sm" onclick="App.scanImages()">🔄 扫描</button>
            <button class="btn btn-sm" id="header-theme-btn" onclick="App.cycleTheme()">🎨</button>
        </div>
    </header>

    <!-- Main Layout -->
    <div id="app-body">
        <!-- Left Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-tabs">
                <button class="tab-btn active" data-panel="navigator">📁 图片</button>
                <button class="tab-btn" data-panel="labels">🏷️ 标签</button>
                <button class="tab-btn" data-panel="model">🧠 模型</button>
                <button class="tab-btn" data-panel="predict">🔮 预测</button>
                <button class="tab-btn" data-panel="review">👁️ 审核</button>
                <button class="tab-btn" data-panel="settings">⚙️ 设置</button>
            </div>
            <div class="sidebar-content" id="sidebar-content"></div>
        </aside>

        <!-- Main Canvas Area -->
        <main id="main-area">
            <!-- Toolbar -->
            <div id="toolbar">
                <div class="tool-group tool-group-bordered">
                    <button class="tool-btn active" data-tool="select" title="选择/移动 (S)">
                        <svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 2l4 12 1.5-4.5L12 8z" fill="currentColor"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="draw" title="绘制矩形框 (R)">
                        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="polygon" title="绘制多边形 (P) — 点击添加顶点，回到起点闭合完成">
                        <svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,6 13,14 3,14 1,6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E) — 右键或点击擦除标注">
                        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="5" width="10" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" transform="rotate(-15 8 8)"/><line x1="9" y1="3" x2="14" y2="10" stroke="currentColor" stroke-width="1.5"/></svg>
                    </button>
                    <button class="tool-btn" data-tool="pan" title="平移画布 (H)">✋</button>
                </div>
                <div class="tool-group">
                    <select id="active-class-select" class="tool-select" title="当前标注标签"></select>
                </div>
                <div class="tool-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" id="btn-toggle-original" title="查看原图 / 标注 (`)`">👁️</button>
                    <button class="tool-btn" id="btn-toggle-comparison" title="对比模式">🔀</button>
                </div>
                <div class="tool-divider"></div>
                <div class="tool-group">
                    <label class="tool-label-inline">透明度</label>
                    <input type="range" id="opacity-slider" min="5" max="100" value="30" title="标注透明度"
                        style="width:80px;accent-color:var(--accent);">
                    <span id="opacity-val" style="font-size:11px;color:var(--text-muted);min-width:28px;">30%</span>
                </div>
                <div class="tool-divider"></div>
                <div class="tool-group">
                    <button class="tool-btn" id="btn-zoom-out" title="缩小">🔍-</button>
                    <span id="zoom-level" style="font-size:11px;color:var(--text-muted);min-width:40px;text-align:center;">100%</span>
                    <button class="tool-btn" id="btn-zoom-in" title="放大">🔍+</button>
                    <button class="tool-btn" id="btn-zoom-fit" title="适应窗口">📐</button>
                </div>
            </div>

            <!-- Canvas container -->
            <div id="canvas-container">
                <div id="canvas-wrapper">
                    <div id="img-layer" style="position:absolute;display:flex;align-items:center;justify-content:center;">
                        <img id="main-image" src="" alt="" style="display:none;">
                    </div>
                    <canvas id="annotation-canvas"></canvas>
                    <div id="canvas-placeholder" class="placeholder">
                        <div class="placeholder-icon">🖼️</div>
                        <p>选择一张图片开始标注</p>
                        <div class="shortcut-hints">
                            <span><kbd>R</kbd> 矩形</span>
                            <span><kbd>P</kbd> 多边形</span>
                            <span><kbd>S</kbd> 选择</span>
                            <span><kbd>Esc</kbd> 取消</span>
                        </div>
                    </div>
                </div>
                <!-- Label dropdown shown after drawing -->
                <div id="label-dropdown" class="label-dropdown" style="display:none;">
                    <div class="label-dropdown-title">选择标签</div>
                    <div id="label-dropdown-list"></div>
                </div>
            </div>

            <!-- Status bar -->
            <div id="status-bar">
                <span id="status-image-info">未选择图片</span>
                <span id="status-tool-hint"></span>
                <span id="status-coords"></span>
                <span id="status-box-count"></span>
            </div>
        </main>

        <!-- Right Panel: Annotation List -->
        <aside id="right-panel">
            <div class="panel-header">
                <h3>📋 标注列表</h3>
                <span id="ann-count-badge">0</span>
            </div>
            <div class="panel-actions">
                <button class="btn btn-sm" id="btn-save" onclick="Canvas.saveAnnotations()">💾 保存</button>
                <button class="btn btn-sm" id="btn-undo" onclick="Canvas.undoLast()">↩️ 撤销</button>
                <button class="btn btn-sm btn-danger" id="btn-clear" onclick="Canvas.clearAnnotations()">🗑️ 清空</button>
            </div>
            <div class="panel-actions" style="border-top:1px solid var(--border-color);padding-top:6px;">
                <button class="btn btn-sm btn-success" onclick="Canvas.adoptAll()" title="采纳全部模型预测为人工标签，清除模型预测" style="font-size:10px;">✅ 采纳全部</button>
                <button class="btn btn-sm" onclick="Canvas.adoptPredictions('replace')" title="用模型预测完全替换人工标注" style="font-size:10px;">🤖→✋ 替换</button>
            </div>
            <div class="panel-filter" style="padding:4px 8px;display:flex;gap:4px;">
                <button class="btn btn-xs active" data-filter="all" onclick="Canvas.setListFilter('all')">全部</button>
                <button class="btn btn-xs" data-filter="human" onclick="Canvas.setListFilter('human')">✋ 人工</button>
                <button class="btn btn-xs" data-filter="model" onclick="Canvas.setListFilter('model')">🤖 模型</button>
            </div>
            <div class="panel-actions" style="border-top:1px solid var(--border-color);padding-top:4px;">
                <button class="btn btn-sm" onclick="Canvas.moveCurrentImage('train')" style="font-size:10px;">📁→训练集</button>
                <button class="btn btn-sm" onclick="Canvas.moveCurrentImage('val')" style="font-size:10px;">📁→验证集</button>
                <button class="btn btn-sm btn-danger" onclick="Canvas.deleteCurrentImage()" style="font-size:10px;">🗑️删除</button>
            </div>
            <div id="annotation-list" class="scroll-list">
                <div class="placeholder">暂无标注</div>
            </div>
        </aside>
    </div>

    <!-- Toast -->
    <div id="toast-container"></div>

    <!-- Modal -->
    <div id="modal-overlay" style="display:none;">
        <div id="modal-box">
            <div id="modal-header">
                <h3 id="modal-title"></h3>
                <button id="modal-close" onclick="App.closeModal()">✕</button>
            </div>
            <div id="modal-body"></div>
            <div id="modal-footer"></div>
        </div>
    </div>

    <script src="/static/js/state.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/canvas.js"></script>
    <script src="/static/js/imageNavigator.js"></script>
    <script src="/static/js/classManager.js"></script>
    <script src="/static/js/modelPanel.js"></script>
    <script src="/static/js/predictionPanel.js"></script>
    <script src="/static/js/comparisonView.js"></script>
    <script src="/static/js/reviewPanel.js"></script>
    <script src="/static/js/exportPanel.js"></script>
    <script src="/static/js/settingsPanel.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
